<svg xmlns="http://www.w3.org/2000/svg" width="560" height="64" viewBox="0 0 560 64" role="img" aria-label="CERTIFICATIONS">
  <style>
    .bg { fill:#0d1117; }
    .frame { fill:none; stroke:#21262d; stroke-width:1; rx:8; }
    .tag { font:600 21px "JetBrains Mono","Fira Code",Consolas,monospace; fill:#00e5ff; letter-spacing:2.5px; }
    .sub { font:400 11px "JetBrains Mono",Consolas,monospace; fill:#8b949e; letter-spacing:1.2px; }
    .tick { fill:#30363d; }
    .dot1 { fill:#ff5f56; } .dot2 { fill:#ffbd2e; } .dot3 { fill:#27c93f; }
    .cursor { fill:#00ff88; animation: blink 1.1s steps(1) infinite; }
    .sweep { fill:#00ff88; opacity:0.10; animation: sweep 3.2s ease-in-out infinite; }
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes sweep { 0%{transform:translateX(-70px)} 55%{transform:translateX(650px)} 100%{transform:translateX(650px)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  </style>
  <rect class="bg" width="560" height="64" rx="10"/>
  <rect class="frame" x="0.5" y="0.5" width="559" height="63" rx="10"/>
  <rect class="sweep" x="0" y="0" width="46" height="64"/>
  <circle class="tick" cx="18" cy="14" r="3.2"/><circle class="tick" cx="30" cy="14" r="3.2"/><circle class="tick" cx="42" cy="14" r="3.2"/>
  <text class="tag" x="22" y="44">// CERTIFICATIONS<tspan class="cursor" dx="6">_</tspan></text>
  <text class="sub" x="544" y="44" text-anchor="end">AMD ACADEMY</text>
</svg>